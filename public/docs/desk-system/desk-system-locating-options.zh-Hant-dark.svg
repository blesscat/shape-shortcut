<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">固定用的角座，二選一</title>
  <desc id="desc">獨立鎖定角座另行列印並裝入盒底插槽；內建角座與盒子一起列印。兩種固定方式都搭配 Snap。</desc>
  <rect width="600" height="430" rx="12" fill="#201a16"/>
  <text x="24" y="36" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#f4ede7">固定用的角座，選一種</text>
<rect x="24" y="65" width="266" height="325" rx="20" fill="#2e1065" stroke="#4338ca"/>
<path d="M 84 157 L 196 157 L 226 181 L 114 181 Z M 114 181 V 236 H 226 V 181" fill="#201a16" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="174" cy="235" rx="14" ry="7" fill="#201a16" stroke="#fbbf24" stroke-width="3"/>
<path d="M 174 282 V 309" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="174" cy="282" rx="17" ry="7" fill="#fbbf24"/>
<path d="M 174 270 V 250" stroke="#b8a99f" stroke-width="2" stroke-dasharray="5 4"/>
<text x="44" y="108" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#c4b5fd">獨立鎖定角座</text>
<text x="44" y="346" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#fcd34d">另外列印角座</text>
<rect x="310" y="65" width="266" height="325" rx="20" fill="#2e1065" stroke="#4338ca"/>
<path d="M 370 157 L 482 157 L 512 181 L 400 181 Z M 400 181 V 236 H 512 V 181" fill="#201a16" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/>
<path d="M 438 236 V 272 M 485 236 V 272" stroke="#fbbf24" stroke-width="13" stroke-linecap="round"/>
<text x="330" y="108" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#c4b5fd">內建角座</text>
<text x="330" y="346" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700" fill="#fcd34d">與盒子一起列印</text>
</svg>
