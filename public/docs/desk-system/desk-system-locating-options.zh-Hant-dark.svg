<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Desk System 定位方式</title>
  <desc id="desc">兩種互斥的定位方式：獨立 Locating Post，或盒子內建角座。內建角座不需要額外 Locating Post。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="560" fill="#201a16"/>
  <text x="55" y="58" fill="#f4ede7" font-family="Noto Sans TC, Inter, sans-serif" font-size="32" font-weight="750">選擇一種定位方式</text>
  <text x="55" y="92" fill="#b8a99f" font-family="Noto Sans TC, Inter, sans-serif" font-size="18">兩種方式都能定位同一個盒位；不可同時使用。</text>

  <g filter="url(#shadow)">
    <rect x="55" y="140" width="465" height="300" rx="24" fill="#451a03" stroke="#fbbf24" stroke-width="3"/>
    <rect x="580" y="140" width="465" height="300" rx="24" fill="#451a03" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <text x="90" y="185" fill="#fcd34d" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700">A. 獨立 Locating Post</text>
  <rect x="130" y="255" width="150" height="115" rx="14" fill="#2e1065" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="205" cy="255" r="24" fill="#fbbf24" stroke="white" stroke-width="5"/>
  <rect x="185" y="385" width="40" height="35" rx="6" fill="#fbbf24"/>
  <path d="M 205 280 V 385" stroke="#fcd34d" stroke-width="6"/>
  <text x="320" y="270" fill="#d9cec5" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">盒子使用一般角座孔。</text>
  <text x="320" y="302" fill="#b8a99f" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">另外列印並安裝一個</text>
  <text x="320" y="330" fill="#b8a99f" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">獨立 Locating Post。</text>
  <text x="320" y="380" fill="#fcd34d" font-family="Noto Sans TC, Inter, sans-serif" font-size="16" font-weight="700">需要額外零件</text>

  <text x="615" y="185" fill="#fcd34d" font-family="Noto Sans TC, Inter, sans-serif" font-size="24" font-weight="700">B. 內建角座</text>
  <rect x="670" y="255" width="150" height="115" rx="14" fill="#2e1065" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M 745 370 V 415" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
  <circle cx="745" cy="255" r="24" fill="#fbbf24" stroke="white" stroke-width="5"/>
  <text x="860" y="270" fill="#d9cec5" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">選擇盒子的</text>
  <text x="860" y="302" fill="#b8a99f" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">「內建角座」選項。</text>
  <text x="860" y="330" fill="#b8a99f" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">定位座是盒子的一部分。</text>
  <text x="860" y="380" fill="#fcd34d" font-family="Noto Sans TC, Inter, sans-serif" font-size="16" font-weight="700">不需要額外 Locating Post</text>

  <rect x="245" y="475" width="610" height="50" rx="25" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
  <text x="550" y="507" text-anchor="middle" fill="#a5b4fc" font-family="Noto Sans TC, Inter, sans-serif" font-size="18" font-weight="700">同一個盒位請選 A 或 B，不要同時使用</text>
</svg>
