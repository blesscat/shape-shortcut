<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Choose one fixing-seat style</title>
  <desc id="desc">Separate locking seats are printed separately and inserted into the box sockets. Built-in seats are printed as part of the box. Both fixing styles use Snap.</desc>
  <rect width="600" height="430" rx="12" fill="#f0f1f4"/>
  <text x="24" y="36" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Choose one seat style</text>
<rect x="24" y="65" width="266" height="325" rx="20" fill="#f3eefe" stroke="#c7d2fe"/>
<path d="M 84 157 L 196 157 L 226 181 L 114 181 Z M 114 181 V 236 H 226 V 181" fill="#f0f1f4" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="174" cy="235" rx="14" ry="7" fill="#f0f1f4" stroke="#f59e0b" stroke-width="3"/>
<path d="M 174 282 V 309" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="174" cy="282" rx="17" ry="7" fill="#f59e0b"/>
<path d="M 174 270 V 250" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="44" y="108" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#5b21b6">Separate seats</text>
<text x="44" y="346" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#92400e">Print extra seats</text>
<rect x="310" y="65" width="266" height="325" rx="20" fill="#f3eefe" stroke="#c7d2fe"/>
<path d="M 370 157 L 482 157 L 512 181 L 400 181 Z M 400 181 V 236 H 512 V 181" fill="#f0f1f4" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
<path d="M 438 236 V 272 M 485 236 V 272" stroke="#f59e0b" stroke-width="13" stroke-linecap="round"/>
<text x="330" y="108" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#5b21b6">Built-in seats</text>
<text x="330" y="346" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#92400e">Printed with box</text>
</svg>
