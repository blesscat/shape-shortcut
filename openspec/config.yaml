schema: spec-driven

context: |
  Component naming convention: components that belong to OpenGrid MUST use the
  lowercase `opengrid-<component-slug>` prefix in their stable modelId,
  buildKey, route slug, catalog component directory, and CAD-kernel component
  directory. Their user-facing display name MUST begin with `OpenGrid `.
  Components outside OpenGrid MUST not receive this prefix. Existing component
  IDs remain unchanged unless a change explicitly scopes a compatibility
  migration.

rules:
  proposal:
    - Apply the OpenGrid naming convention to every new OpenGrid component and state whether existing IDs are intentionally preserved.
  specs:
    - Normative requirements for a new OpenGrid component MUST use its `opengrid-<component-slug>` modelId and route slug.
  design:
    - Keep OpenGrid component assets and Worker-only builders under matching `opengrid-<component-slug>` directories.
  tasks:
    - Include a verifiable naming/catalog task whenever a new OpenGrid component is added.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Scope automated test runs by default - use `pnpm test:changed` or
        `pnpm test:branch` for unit/worker coverage, and run only the e2e
        specs that touch the changed surfaces. Reserve the full vitest suite
        and the full dev-server e2e suite for cross-cutting changes (shared
        catalogs, shared UI, contract files), a final pre-publish gate, or an
        explicit user request."
