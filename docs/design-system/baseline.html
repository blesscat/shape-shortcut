<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Shape Shortcut · 視覺基準</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 24px;
      font: 16px/1.7 system-ui;
      background: #e6e7eb;
      color: #252833;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0 0 12px;
    }
    h1 {
      font-size: 28px;
    }
    h2 {
      font-size: 20px;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    .screen {
      --page: #f8f7f4;
      --card: #fff;
      --ink: #252833;
      --muted: #626775;
      --action: #4659cf;
      --label: #fff;
      --soft: #eceffc;
      background: var(--page);
      color: var(--ink);
      padding: 20px;
      border-radius: 20px;
    }
    .dark {
      --page: #181a20;
      --card: #22252d;
      --ink: #f1f2f6;
      --muted: #adb3c2;
      --action: #a8b5ff;
      --label: #181a20;
      --soft: #2b3352;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #828b9e;
      padding-bottom: 12px;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .nav strong {
      margin-right: auto;
    }
    .hero,
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .hero h2 {
      font-size: 30px;
      line-height: 1.3;
    }
    .muted {
      color: var(--muted);
    }
    .button {
      display: inline-block;
      padding: 10px 16px;
      background: var(--action);
      color: var(--label);
      border-radius: 10px;
      font-weight: 600;
    }
    .card {
      padding: 16px;
      background: var(--card);
      border-radius: 16px;
    }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .model {
      height: 100px;
      display: grid;
      place-items: center;
      background: var(--soft);
      border-radius: 10px;
      font-size: 40px;
    }
    .field {
      padding: 8px 12px;
      border: 1px solid #828b9e;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .canvas {
      display: grid;
      place-items: center;
      min-height: 220px;
      background: var(--card);
      border-radius: 16px;
    }
    .box {
      width: 100px;
      height: 100px;
      border: 6px solid #4e7cff;
      transform: skewY(-10deg);
      background: #4e7cff33;
    }
    .icons {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 16px;
    }
    .icons img {
      image-rendering: auto;
    }
    .caption {
      font-size: 14px;
      color: var(--muted);
    }
    @media (max-width: 800px) {
      .pair {
        grid-template-columns: 1fr;
      }
      .hero {
        grid-template-columns: 1fr;
      }
      .nav {
        flex-wrap: wrap;
      }
      .nav strong {
        width: 100%;
      }
      .workspace {
        grid-template-columns: 1fr;
      }
      .canvas {
        order: -1;
      }
      .cards {
        grid-template-columns: 1fr;
      }
      body {
        margin: 12px;
      }
    }
  </style>
  <h1>Shape Shortcut：展示、選擇、操作</h1>
  <p>
    設計基準，非產品截圖。縮窄視窗至 390px／320px 檢查長文字。手機 CAD 保留
    overlay，候選分區需另通過實機閘門。
  </p>
  <script>
    const examples = [
      [
        '首頁',
        '<div class="hero"><div><p class="muted">免安裝 · 瀏覽器裡算</p><h2>讓收納，<br>剛好適合你的空間。</h2><p class="muted">挑選模型，調整尺寸，再下載列印。</p><span class="button">開始挑模型</span></div><div class="card"><div class="model">▱ ▱ ▱</div><h3>OpenGrid Desk</h3><p class="muted">從一個角落，開始整理。</p></div></div>',
      ],
      [
        '模型列表',
        '<h2>挑一個你喜歡的模型</h2><p>Desk　 Wall　 其他</p><div class="cards"><div class="card"><div class="model">▱</div><h3>可堆疊方盒</h3><p class="muted">可調整尺寸的通用收納盒。</p><span class="button">調整模型</span></div><div class="card"><div class="model">◯</div><h3>OpenGrid OpenConnect 長名稱收納模型</h3><p class="muted">名稱完整換行，保留模型差異。</p><span class="button">調整模型</span></div></div>',
      ],
      [
        'CAD',
        '<h2>OpenGrid 方盒</h2><div class="workspace"><div class="card"><h3>尺寸</h3><div class="field">X　4 格</div><div class="field">Y　3 格</div><div class="field">盒內淨高　30 mm</div><p class="muted">結構與進階設定</p><span class="button">下載 STL</span></div><div class="canvas"><div class="box"></div><p class="caption">模型預覽 · 已更新</p></div></div>',
      ],
    ]
    for (const [title, markup] of examples) {
      const pair = document.createElement('section')
      pair.className = 'pair'
      for (const theme of ['', 'dark']) {
        const panel = document.createElement('article')
        panel.className = 'screen ' + theme
        panel.innerHTML =
          '<div class="nav"><strong>Shape Shortcut</strong><span>模型</span><span>文件</span><span>關於</span></div><p class="caption">' +
          title +
          ' / ' +
          (theme ? '深色' : '淺色') +
          '</p>' +
          markup
        pair.append(panel)
      }
      document.body.append(pair)
    }
  </script>
  <div class="screen">
    <h2>Favicon 實際尺寸</h2>
    <div class="icons">
      <img
        src="../../public/favicon.svg"
        width="16"
        height="16"
        alt="16px S"
      /><img
        src="../../public/favicon.svg"
        width="32"
        height="32"
        alt="32px S"
      /><span class="dark" style="padding: 12px"
        ><img
          src="../../public/favicon.svg"
          width="16"
          height="16"
          alt="深色背景 16px S"
      /></span>
    </div>
  </div>
</html>
